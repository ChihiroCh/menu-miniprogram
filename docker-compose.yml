services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: menu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menu_dev}
      POSTGRES_DB: family_menu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - menu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu -d family_menu"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  menu_pg:
